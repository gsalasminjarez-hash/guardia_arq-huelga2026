<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rol de Guardias – Huelga Mayo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2330;
    --border: #2a2f3d;
    --accent: #e8c547;
    --accent2: #e87d47;
    --text: #eef0f5;
    --muted: #6b7280;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: linear-gradient(135deg, #1a1f2e 0%, #0d0f14 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
  }

  header p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  /* SEARCH */
  .search-section { padding: 24px 0 12px; }

  .search-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }

  .search-box {
    position: relative;
  }

  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box input::placeholder { color: var(--muted); }

  /* NAME LIST */
  .names-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-top: 8px;
    max-height: 280px;
    overflow-y: auto;
  }

  .name-item {
    padding: 13px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .name-item:last-child { border-bottom: none; }
  .name-item:hover, .name-item:active { background: var(--surface2); }

  .name-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .brigade-tag {
    font-size: 0.7rem;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }

  /* PROFILE VIEW */
  .profile { display: none; padding-top: 8px; }
  .profile.active { display: block; }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 16px 0 12px;
  }

  .profile-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .profile-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .profile-brigade {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  /* COUNTDOWN */
  .countdown-card {
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .countdown-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .countdown-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .countdown-time {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .countdown-detail {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .on-duty {
    color: var(--accent2);
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* SHIFTS LIST */
  .shifts-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .shift-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.2s;
  }

  .shift-card.past { opacity: 0.4; }
  .shift-card.next { border-color: var(--accent); }
  .shift-card.active-now { border-color: var(--accent2); background: rgba(232,125,71,0.08); }

  .shift-date-block {
    text-align: center;
    min-width: 44px;
  }

  .shift-day-num {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
  }

  .shift-card.active-now .shift-day-num { color: var(--accent2); }

  .shift-day-name {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .shift-info { flex: 1; }

  .shift-time {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .shift-date-full {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .shift-badge {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .badge-next { background: rgba(232,197,71,0.15); color: var(--accent); }
  .badge-now  { background: rgba(232,125,71,0.2); color: var(--accent2); }
  .badge-done { background: rgba(107,114,128,0.15); color: var(--muted); }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* scrollbar */
  .names-list::-webkit-scrollbar { width: 4px; }
  .names-list::-webkit-scrollbar-track { background: transparent; }
  .names-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>⚑ Rol de Guardias</h1>
  <p>Huelga · Mayo 2026</p>
</header>

<div class="container">

  <!-- SEARCH VIEW -->
  <div id="searchView">
    <div class="search-section">
      <span class="search-label">Busca tu nombre</span>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Escribe tu nombre..." autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
    </div>
    <div class="names-list" id="namesList"></div>
  </div>

  <!-- PROFILE VIEW -->
  <div class="profile" id="profileView">
    <button class="back-btn" onclick="goBack()">← Volver</button>
    <div class="profile-header" id="profileHeader"></div>
    <div class="countdown-card" id="countdownCard"></div>
    <div class="shifts-title">Todos tus turnos</div>
    <div id="shiftsList"></div>
  </div>

</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────
const BRIGADE_COLORS = {
  "Brigada 01": {bg:"#1F7A4A", fg:"#FFFFFF"},
  "Brigada 02": {bg:"#4472C4", fg:"#FFFFFF"},
  "Brigada 03": {bg:"#7F7F7F", fg:"#FFFFFF"},
  "Brigada 04": {bg:"#ED7D31", fg:"#FFFFFF"},
  "Brigada 05": {bg:"#70AD47", fg:"#FFFFFF"},
  "Brigada 06": {bg:"#C00000", fg:"#FFFFFF"},
  "Brigada 07": {bg:"#9DC3E6", fg:"#000000"},
  "Brigada 08": {bg:"#FFD966", fg:"#000000"},
  "Brigada 09": {bg:"#548235", fg:"#FFFFFF"},
  "Brigada 10": {bg:"#FF0000", fg:"#FFFFFF"},
  "Brigada 11": {bg:"#BF8F00", fg:"#FFFFFF"},
  "Brigada 12": {bg:"#595959", fg:"#FFFFFF"},
  "Brigada 13": {bg:"#F4B942", fg:"#000000"},
  "Brigada 14": {bg:"#2E4057", fg:"#FFFFFF"},
  "Brigada 15": {bg:"#A9D18E", fg:"#000000"},
  "Brigada 16": {bg:"#843C0C", fg:"#FFFFFF"},
};

const BRIGADES = {
  "Brigada 01": ["ARODI MORALES HOLGUÍN","LUIS ANTONIO URÍAS DE LA VEGA","JOSÉ JORGE ABRIL HOYOS","IVAN ERNESTO ESCALANTE LEY"],
  "Brigada 02": ["ERÉNDIRA TREVIÑO BASULTO","MARÍA ELSA ITURBE BONILLA","TAMY GABRIELA RÍOS SOTO","VLADIMIR CASAS FÉLIX"],
  "Brigada 03": ["IVONNE ELISA ÁLVAREZ VALENZUELA","ORALIA JIMENA CHÁVEZ ORDUÑO","ANA MELISSA CAMPA SÁNCHEZ","GUSTAVO ADOLFO SALAS MINJAREZ"],
  "Brigada 04": ["LUZ DEL CARMEN AYÓN MUNGUÍA","GIOVANNA SÁNCHEZ GALINDO","ROSA MARÍA MENDOZA ROBLES","SANDRA LUZ GUERRERO MARTÍNEZ"],
  "Brigada 05": ["DANIEL FRANCO GARZA","RAÚL ISMAEL ROMANDÍA MANZO","ALFREDO VILLEGAS KURAICA","RAÚL ISIDRO GUTIÉRREZ RUIZ"],
  "Brigada 06": ["ANA CRISTINA SOTELO MUNDO","EDNA GUADALUPE TÉLLEZ MORALES","LUISA MARÍA GUTIÉRREZ SÁNCHEZ","ANDRÉS ABRAHAM ELIZALDE GARCÍA"],
  "Brigada 07": ["LAURA MERCADO MALDONADO","FERNANDO SALDAÑA CÓRDOBA","MIGUEL NAVARRO VELÁSQUEZ","ROCÍO DE FÁTIMA SÁNCHEZ CASTILLO"],
  "Brigada 08": ["DARÍO SOTELO BADILLA","EUGENIO ROBERTO MARCOR RAMÍREZ","JOSÉ LUIS CORONADO ROMERO","LUIS RAMÓN PELLAT MOLINA"],
  "Brigada 09": ["GABRIEL MENDOZA MORALES","SAÚL MANUEL ESPARZA LOZANO","PATRICIA SANDOVAL MURILLO","ÓSCAR ARMANDO PRECIADO PÉREZ"],
  "Brigada 10": ["CARMEN EUGENIA VALENCIA GRACIA","MARTHA MARTINA ROBLES BALDENEGRO","EDITH JAQUELINE ROMERO GARCÍA","MARÍA DE LA CONCEPCIÓN HURTADO ABRIL"],
  "Brigada 11": ["ALEJANDRO PUEBLA GUTIÉRREZ","URIEL BULMARO NERI MARTÍNEZ","FRANCISCO LÓPEZ BRAMBILA","JULIO CÉSAR MARCOR RAMÍREZ"],
  "Brigada 12": ["MÓNICA FERNANDA PALACIOS GURROLA","JESÚS ROMÁN RUIZ ALDUENDA","NOEL ARMANDO CORONA URQUIJO","NORA ERICKA PARRA CANO"],
  "Brigada 13": ["ARLET ALEJANDRA CHÁVEZ BARCELÓ","CECILIA MARÍA GALINDO BORBÓN","BEATRÍZ CLEMENTE MARROQUÍN","MARTÍN FERNANDO CONTRERAS VALENZUELA"],
  "Brigada 14": ["RAMIRO WALTERS CARMELO","FRANCISCO GONZÁLEZ LÓPEZ","JOSÉ MANUEL OCHOA DE LA TORRE","DANIEL RUIZ LUCERO"],
  "Brigada 15": ["RITO EMILIO SALAZAR RUIBAL","LILIAM NOHEMÍ URÍAS GÁMEZ","KARLA INÉS YESCAS FLORES","DANIELA CASTILLO BAÑUELOS"],
  "Brigada 16": ["JOSÉ EDUARDO PUENTE MOLINA","ALONSO GARCÍA ACEVES","ÓSCAR EDGAR PALAFOX FLORES","MARIO YADIR RENDÓN SALLARD"],
};

const CYCLE = [
  "Brigada 01","Brigada 05","Brigada 02","Brigada 03","Brigada 16",
  "Brigada 08","Brigada 04","Brigada 06","Brigada 09","Brigada 11",
  "Brigada 07","Brigada 10","Brigada 12","Brigada 14","Brigada 15","Brigada 13"
];

const TURNOS = [
  {label:"0:00 a 06:00", start:0,  end:6},
  {label:"06:00 a 12:00", start:6,  end:12},
  {label:"12:00 a 18:00", start:12, end:18},
  {label:"18:00 a 24:00", start:18, end:24},
];

const DAYS_ES = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MONTHS_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

// Build slot map: key = "YYYY-MM-DD-turno" → brigade
function buildSlotMap() {
  const map = {};
  const start = new Date(2026, 4, 14); // May 14
  const end   = new Date(2026, 4, 31); // May 31
  let cycleIdx = 0;

  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const startTurno = (d.getTime() === start.getTime()) ? 3 : 0;
    for (let t = startTurno; t < 4; t++) {
      const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}-${t}`;
      map[key] = CYCLE[cycleIdx % CYCLE.length];
      cycleIdx++;
    }
  }
  return map;
}

const slotMap = buildSlotMap();

// Get all shifts for a brigade
function getShiftsForBrigade(brigade) {
  const shifts = [];
  for (const [key, brig] of Object.entries(slotMap)) {
    if (brig === brigade) {
      const [y, m, d, t] = key.split('-').map(Number);
      const date = new Date(y, m-1, d);
      shifts.push({ date, turnoIdx: t, turno: TURNOS[t] });
    }
  }
  shifts.sort((a,b) => a.date - b.date || a.turnoIdx - b.turnoIdx);
  return shifts;
}

// Build person → brigade map
const personBrigade = {};
for (const [brig, members] of Object.entries(BRIGADES)) {
  for (const name of members) personBrigade[name] = brig;
}

const allNames = Object.keys(personBrigade).sort();

// ── UI ──────────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const namesList   = document.getElementById('namesList');
const searchView  = document.getElementById('searchView');
const profileView = document.getElementById('profileView');

let countdownInterval = null;

function renderNames(filter = '') {
  const q = filter.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const filtered = allNames.filter(n => {
    const normalized = n.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    return normalized.includes(q);
  });

  if (filtered.length === 0) {
    namesList.innerHTML = `<div class="empty">No se encontró ningún nombre</div>`;
    return;
  }

  namesList.innerHTML = filtered.map(name => {
    const brig = personBrigade[name];
    const col = BRIGADE_COLORS[brig];
    return `<div class="name-item" onclick="showProfile('${name.replace(/'/g,"\\'")}')">
      <span class="name-dot" style="background:${col.bg}"></span>
      <span>${name}</span>
      <span class="brigade-tag">${brig}</span>
    </div>`;
  }).join('');
}

searchInput.addEventListener('input', () => renderNames(searchInput.value));
renderNames();

function showProfile(name) {
  const brigade = personBrigade[name];
  const col = BRIGADE_COLORS[brigade];
  const shifts = getShiftsForBrigade(brigade);

  searchView.style.display = 'none';
  profileView.classList.add('active');

  // Header
  document.getElementById('profileHeader').innerHTML = `
    <div class="profile-name">${name}</div>
    <span class="profile-brigade" style="background:${col.bg};color:${col.fg}">${brigade}</span>
  `;

  renderShifts(shifts, col);
  startCountdown(shifts, col);
}

function renderShifts(shifts, col) {
  const now = new Date();
  const list = document.getElementById('shiftsList');

  if (shifts.length === 0) {
    list.innerHTML = `<div class="empty">No hay turnos asignados</div>`;
    return;
  }

  list.innerHTML = shifts.map(s => {
    const shiftStart = new Date(s.date.getFullYear(), s.date.getMonth(), s.date.getDate(), s.turno.start);
    const shiftEnd   = new Date(s.date.getFullYear(), s.date.getMonth(), s.date.getDate(), s.turno.end === 24 ? 23 : s.turno.end);
    if (s.turno.end === 24) shiftEnd.setMinutes(59,59);

    const isPast   = shiftEnd < now;
    const isNow    = shiftStart <= now && shiftEnd >= now;
    const isNext   = !isPast && !isNow;

    const dayName  = DAYS_ES[s.date.getDay()];
    const dayNum   = s.date.getDate();
    const monthStr = MONTHS_ES[s.date.getMonth()];

    let cardClass = 'shift-card';
    let badge = '';
    if (isPast)  { cardClass += ' past'; badge = `<span class="shift-badge badge-done">Completado</span>`; }
    if (isNow)   { cardClass += ' active-now'; badge = `<span class="shift-badge badge-now">● Ahora</span>`; }

    return `<div class="${cardClass}">
      <div class="shift-date-block">
        <div class="shift-day-num">${dayNum}</div>
        <div class="shift-day-name">${dayName.substring(0,3)}</div>
      </div>
      <div class="shift-info">
        <div class="shift-time">${s.turno.label} hrs</div>
        <div class="shift-date-full">${dayName} ${dayNum} de ${monthStr}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
}

function startCountdown(shifts, col) {
  if (countdownInterval) clearInterval(countdownInterval);

  function update() {
    const now = new Date();
    const card = document.getElementById('countdownCard');

    // Find active or next shift
    let activeShift = null;
    let nextShift   = null;

    for (const s of shifts) {
      const shiftStart = new Date(s.date.getFullYear(), s.date.getMonth(), s.date.getDate(), s.turno.start);
      const shiftEnd   = new Date(s.date.getFullYear(), s.date.getMonth(), s.date.getDate(), s.turno.end === 24 ? 23 : s.turno.end);
      if (s.turno.end === 24) shiftEnd.setMinutes(59,59);

      if (shiftStart <= now && shiftEnd >= now) { activeShift = s; break; }
      if (shiftStart > now && !nextShift) nextShift = s;
    }

    if (activeShift) {
      const shiftEnd = new Date(activeShift.date.getFullYear(), activeShift.date.getMonth(), activeShift.date.getDate(), activeShift.turno.end === 24 ? 23 : activeShift.turno.end);
      if (activeShift.turno.end === 24) shiftEnd.setMinutes(59,59);
      const diff = shiftEnd - now;
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      card.innerHTML = `
        <div class="countdown-label">Estado actual</div>
        <div class="on-duty">● ESTÁS DE GUARDIA</div>
        <div class="countdown-detail">Terminas en ${h}h ${m}min · ${activeShift.turno.label} hrs</div>
      `;
    } else if (nextShift) {
      const shiftStart = new Date(nextShift.date.getFullYear(), nextShift.date.getMonth(), nextShift.date.getDate(), nextShift.turno.start);
      const diff = shiftStart - now;
      const days = Math.floor(diff/86400000);
      const h    = Math.floor((diff%86400000)/3600000);
      const m    = Math.floor((diff%3600000)/60000);

      let timeStr = '';
      if (days > 0) timeStr = `${days}d ${h}h ${m}min`;
      else timeStr = `${h}h ${m}min`;

      const dayName  = DAYS_ES[nextShift.date.getDay()];
      const dayNum   = nextShift.date.getDate();
      const monthStr = MONTHS_ES[nextShift.date.getMonth()];

      card.innerHTML = `
        <div class="countdown-label">Próxima guardia en</div>
        <div class="countdown-time">${timeStr}</div>
        <div class="countdown-detail">${dayName} ${dayNum} de ${monthStr} · ${nextShift.turno.label} hrs</div>
      `;
    } else {
      card.innerHTML = `
        <div class="countdown-label">Estado</div>
        <div class="countdown-time" style="font-size:1rem;color:var(--muted)">Sin turnos pendientes en mayo</div>
      `;
    }
  }

  update();
  countdownInterval = setInterval(update, 30000);
}

function goBack() {
  if (countdownInterval) clearInterval(countdownInterval);
  profileView.classList.remove('active');
  searchView.style.display = '';
  searchInput.value = '';
  renderNames();
}
</script>
</body>
</html>
